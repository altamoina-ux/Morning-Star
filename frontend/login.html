<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>登录 - 启明智能陪护管理平台</title>
  <style>
    :root{color-scheme:dark;--bg:#071426;--panel:#102541;--line:#204568;--text:#e9f4ff;--muted:#9ab4cd;--blue:#55c9ff;--red:#ff8c9c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071426;color:var(--text);font:14px "Segoe UI","Microsoft YaHei",sans-serif}.login-shell{min-height:100vh;display:grid;grid-template-columns:55% 45%;max-width:1720px;margin:auto}.brand{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:7vh 7vw 5vh;background:radial-gradient(ellipse at 18% 15%,#173e64 0,#0b2541 37%,#08192e 78%)}.brand:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.2;background-image:linear-gradient(rgba(104,190,230,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(104,190,230,.22) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(135deg,#000,transparent 78%)}.brand:after{content:"";position:absolute;z-index:-1;width:58vw;height:58vw;max-width:780px;max-height:780px;right:-22vw;top:19%;border:1px solid rgba(85,201,255,.19);border-radius:50%;box-shadow:0 0 0 40px rgba(85,201,255,.035),0 0 0 90px rgba(85,201,255,.025),inset 0 0 100px rgba(85,201,255,.08)}.brand-head{display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(85,201,255,.6);border-radius:12px;color:var(--blue);font-size:25px;background:#0b2038;box-shadow:0 0 28px rgba(85,201,255,.12)}.brand-name{font-size:18px;font-weight:650}.brand-main{max-width:650px;margin:auto 0;padding:80px 0}.eyebrow{color:#77d7ff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}.brand h1{max-width:620px;margin:18px 0;font-size:clamp(38px,4.1vw,64px);line-height:1.2;font-weight:650}.slogan{margin:0;color:#bed0df;font-size:20px}.visual{position:absolute;right:8%;bottom:18%;width:min(38vw,520px);height:240px;opacity:.65;pointer-events:none}.visual svg{width:100%;height:100%}.brand-foot{color:#93aabe;font-size:13px;line-height:1.8}.auth-side{display:flex;align-items:center;justify-content:center;padding:48px 6vw 78px;background:linear-gradient(145deg,#0b1b30,#091728)}.login-card{width:min(100%,430px);padding:40px 38px 34px;border:1px solid rgba(91,143,180,.32);border-radius:12px;background:rgba(16,37,65,.76);box-shadow:0 22px 70px #0005,inset 0 1px rgba(255,255,255,.035)}.login-title{margin:0;font-size:30px;font-weight:650}.login-subtitle{margin:9px 0 28px;color:var(--muted)}.error-banner{margin:0 0 18px;padding:11px 13px;border:1px solid rgba(255,140,156,.4);border-radius:7px;background:rgba(91,31,48,.5);color:#ffb0bb;line-height:1.5}.error-banner[hidden]{display:none}.field{margin:0 0 17px}.field label{display:block;margin:0 0 8px;color:#c8d8e6;font-size:13px}.input-wrap{height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid #294562;border-radius:7px;background:#091a2d;transition:border .15s,box-shadow .15s}.input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(85,201,255,.12)}.field.invalid .input-wrap{border-color:#ff687e}.field-icon{width:18px;color:#829db6;font-size:17px;text-align:center}.input-wrap input{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;color:#f5faff;font:inherit}.input-wrap input::placeholder{color:#71879d}.icon-button{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:5px;background:transparent;color:#a6bed3;cursor:pointer}.icon-button:hover{background:#173b5d;color:#fff}.field-error{min-height:0;margin-top:5px;color:#ff8c9c;font-size:12px}.field-error:empty{display:none}.captcha-row{display:grid;grid-template-columns:1fr 150px;gap:10px}.captcha-image{display:block;width:150px;height:46px;border:1px solid #294562;border-radius:7px;background:#091a2d;cursor:pointer}.captcha-hint{margin-top:6px;color:#7f98b0;font-size:11px}.assist{display:flex;justify-content:space-between;align-items:center;margin:1px 0 22px;color:#a9bed0;font-size:13px}.remember{display:flex;align-items:center;gap:8px;cursor:pointer}.remember input{width:16px;height:16px;margin:0;accent-color:var(--blue)}.text-link{padding:0;border:0;background:none;color:#72d4ff;font:inherit;cursor:pointer}.text-link:hover{color:#b4edff}.submit{width:100%;height:48px;border:1px solid #4ab9ed;border-radius:7px;background:#1785b8;color:#fff;font:600 15px inherit;letter-spacing:.12em;cursor:pointer;transition:background .16s,border .16s}.submit:hover{background:#1175a5}.submit:disabled{border-color:#405b70;background:#324b60;color:#9eb0bf;cursor:wait}.spinner{display:inline-block;width:15px;height:15px;margin-right:9px;vertical-align:-3px;border:2px solid #c8dce8;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.security{display:flex;justify-content:center;align-items:center;gap:7px;margin:22px 0 0;color:#8199af;font-size:12px}.security-mark{color:#65d9a5}.copyright{position:fixed;right:0;bottom:22px;left:55%;color:#70869b;text-align:center;font-size:12px}@media(max-width:900px){.login-shell{grid-template-columns:1fr}.brand{display:none}.auth-side{min-height:100vh;padding:34px 20px 80px}.copyright{left:0}}@media(max-width:460px){.login-card{padding:32px 23px 28px}.login-title{font-size:27px}.captcha-row{grid-template-columns:minmax(0,1fr) 130px}.captcha-image{width:130px}.auth-side{padding-right:16px;padding-left:16px}}
  </style>
  <style>
    .visual{right:-6%;bottom:6%;width:min(53vw,700px);height:min(33vw,350px);opacity:.35;border-radius:0;background:url('assets/qiming-hat-hero.png') center/cover no-repeat;box-shadow:none;mix-blend-mode:normal;mask-image:radial-gradient(ellipse at 64% 56%,#000 24%,rgba(0,0,0,.92) 49%,transparent 79%)}.visual svg{display:none}@media(max-width:1100px){.visual{right:-8%;width:min(49vw,560px);height:280px}}@media(max-width:900px){.visual{display:none}}
    .register-prompt{text-align:center;margin:17px 0 0;color:#a9bed0;font-size:13px}.field-hint{margin-top:5px;color:#7894aa;font-size:11px}.terms-row{display:flex;align-items:flex-start;gap:7px;margin:2px 0 18px;color:#a9bed0;font-size:12px;line-height:1.7}.terms-row input{flex:0 0 auto;width:16px;height:16px;margin:2px 0 0;accent-color:var(--blue)}.terms-row .text-link{font-size:12px}.login-card{transition:opacity .13s ease,transform .13s ease}.login-card.switch-out{opacity:0;transform:translateY(7px)}.login-card.switch-in{opacity:0;transform:translateY(-7px)}.message-dialog{width:280px;padding:28px;border:1px solid #2a4d6c;border-radius:10px;background:#102541;color:#e9f4ff;text-align:center;box-shadow:0 24px 80px #0009}.message-dialog::backdrop{background:rgba(2,9,17,.68);backdrop-filter:blur(3px)}.message-dialog h2{margin:9px 0 6px}.message-dialog p{margin:0 0 12px;color:#a9bed0;font-size:13px}.message-dialog strong{color:var(--blue);font-size:24px}.success-mark{margin:auto;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#145443;color:#78e6b8;font-size:25px}.policy-dialog{width:min(430px,calc(100vw - 32px));text-align:left}.policy-dialog .submit{margin-top:20px}.register-card .field{margin-bottom:11px}.register-card .login-subtitle{margin-bottom:17px}.register-card .input-wrap{height:42px}.register-card .field-hint{margin-top:3px}
  </style>
  <script src="login-config.js"></script>
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="brand" aria-label="启明帽平台介绍">
      <div class="brand-head"><div class="logo" aria-hidden="true">✦</div><div class="brand-name">启明智能陪护管理平台</div></div>
      <div class="brand-main"><div class="eyebrow">QIMING HAT · ASSISTIVE CARE</div><h1>让每一步出行<br>都更安心</h1><p class="slogan">智能视觉陪护，守护出行安全</p>
        <div class="visual" aria-hidden="true"><svg viewBox="0 0 520 240" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M40 200H480M80 160H440M120 120H400M160 80H360" stroke="#55C9FF" stroke-opacity=".24"/><path d="M260 24V216M180 44V196M340 44V196" stroke="#55C9FF" stroke-opacity=".22"/><path d="M60 190L160 110L225 150L315 62L455 126" stroke="#55C9FF" stroke-width="2" stroke-opacity=".8"/><circle cx="160" cy="110" r="5" fill="#55C9FF"/><circle cx="315" cy="62" r="5" fill="#55E4A5"/><circle cx="455" cy="126" r="5" fill="#FFD166"/><path d="M315 62L360 29" stroke="#55E4A5" stroke-opacity=".7"/><rect x="346" y="12" width="100" height="32" rx="6" fill="#0A1B30" stroke="#55E4A5" stroke-opacity=".5"/><text x="358" y="32" fill="#A9EBD1" font-size="11" font-family="sans-serif">SAFE ROUTE</text></svg></div>
      </div>
      <div class="brand-foot">多设备统一管理 · 实时环境感知 · 全链路安全预警</div>
    </section>
    <section class="auth-side">
      <form id="loginForm" class="login-card" novalidate>
        <h2 class="login-title">欢迎登录</h2><p class="login-subtitle">启明智能陪护管理平台</p>
        <div id="loginError" class="error-banner" role="alert" hidden></div>
        <div class="field" id="usernameField"><label for="username">账号</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">♙</span><input id="username" name="username" autocomplete="username" placeholder="请输入账号" required maxlength="80"></div><div class="field-error" id="usernameError"></div></div>
        <div class="field" id="passwordField"><label for="password">密码</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">▣</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required maxlength="200"><button id="togglePassword" class="icon-button" type="button" aria-label="显示密码" title="显示密码">◉</button></div><div class="field-error" id="passwordError"></div></div>
        <div class="field" id="captchaField"><label for="captcha">图形验证码</label><div class="captcha-row"><div class="input-wrap"><span class="field-icon" aria-hidden="true">#</span><input id="captcha" name="captcha" autocomplete="off" placeholder="输入验证码" required maxlength="8"></div><img id="captchaImage" class="captcha-image" alt="点击刷新验证码" title="点击刷新验证码" tabindex="0"></div><div class="field-error" id="captchaError"></div></div>
        <div class="assist"><label class="remember"><input id="remember" type="checkbox"><span>记住密码</span></label><button id="forgot" class="text-link" type="button">忘记密码？</button></div>
        <button id="submitButton" class="submit" type="submit">登 录</button>
        <p class="register-prompt">还没有账号？ <button class="text-link" type="button" data-mode="register">立即注册</button></p>
        <p class="security"><span class="security-mark" aria-hidden="true">●</span>仅限授权人员使用，请勿泄露账号密码</p>
      </form>
      <form id="registerForm" class="login-card register-card" novalidate hidden>
        <h2 class="login-title">注册账号</h2><p class="login-subtitle">启明智能陪护管理平台</p>
        <div id="registerError" class="error-banner" role="alert" hidden></div>
        <div class="field" id="registerUsernameField"><label for="registerUsername">账号</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">♙</span><input id="registerUsername" autocomplete="username" placeholder="请设置登录账号" maxlength="20"></div><div class="field-hint">4-20位字母、数字组合</div><div class="field-error" id="registerUsernameError"></div></div>
        <div class="field" id="registerEmailField"><label for="registerEmail">联系邮箱</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">✉</span><input id="registerEmail" type="email" autocomplete="email" placeholder="请输入邮箱地址" maxlength="200"></div><div class="field-error" id="registerEmailError"></div></div>
        <div class="field" id="registerPasswordField"><label for="registerPassword">设置密码</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">▣</span><input id="registerPassword" type="password" autocomplete="new-password" placeholder="请设置登录密码" maxlength="20"><button class="icon-button" type="button" data-toggle-password="registerPassword" aria-label="显示密码">◉</button></div><div class="field-hint">6-20位，需包含字母与数字</div><div class="field-error" id="registerPasswordError"></div></div>
        <div class="field" id="registerConfirmField"><label for="registerConfirm">确认密码</label><div class="input-wrap"><span class="field-icon" aria-hidden="true">▣</span><input id="registerConfirm" type="password" autocomplete="new-password" placeholder="请再次输入密码" maxlength="20"></div><div class="field-error" id="registerConfirmError"></div></div>
        <div class="field" id="registerCaptchaField"><label for="registerCaptcha">图形验证码</label><div class="captcha-row"><div class="input-wrap"><span class="field-icon" aria-hidden="true">#</span><input id="registerCaptcha" autocomplete="off" placeholder="输入验证码" maxlength="8"></div><img id="registerCaptchaImage" class="captcha-image" alt="点击刷新验证码" title="点击刷新验证码" tabindex="0"></div><div class="field-error" id="registerCaptchaError"></div></div>
        <label class="terms-row"><input id="registerTerms" type="checkbox"><span>我已阅读并同意<button type="button" class="text-link" data-policy="terms">《用户服务协议》</button>和<button type="button" class="text-link" data-policy="privacy">《隐私政策》</button></span></label>
        <button id="registerSubmit" class="submit" type="submit" disabled>注 册</button>
        <p class="register-prompt">已有账号？ <button class="text-link" type="button" data-mode="login">返回登录</button></p>
      </form>
    </section>
  </main>
  <footer class="copyright">© 2026 启明智能陪护管理平台 版权所有</footer>
  <dialog id="registerSuccess" class="message-dialog"><div class="success-mark">✓</div><h2>注册成功</h2><p>即将返回登录页</p><strong id="redirectCountdown">3</strong></dialog>
  <dialog id="policyDialog" class="message-dialog policy-dialog"><h2 id="policyTitle"></h2><p id="policyContent"></p><button class="submit" type="button" data-close-policy>知道了</button></dialog>
</body>
</html>
